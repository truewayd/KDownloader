<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>关于 TrueDown</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/about.css">
  <link rel="stylesheet" href="/native-appearance.css">
  <script src="/native-appearance.js" defer></script>
  <link rel="stylesheet" href="/native-frame.css">
  <script src="/native-frame.js" defer></script>
  <script src="/about.js" defer></script>
</head>
<body>
  <main>
    <img src="/truedown-logo.svg" width="48" height="48" alt="">
    <h1>TrueDown</h1>
    <p>桌面与命令行共享同一个下载内核。</p>
    <dl aria-label="版本信息"><dt>程序版本</dt><dd id="version">正在读取…</dd><dt>下载内核</dt><dd id="engine">正在读取…</dd><dt>服务连接</dt><dd id="connection">正在读取…</dd></dl>
    <p id="about-status" role="status"></p>
    <p class="hint">界面由 Tauri 提供，下载服务使用 Go 与 aria2。第三方许可证随程序安装。</p>
    <button class="kd-button secondary" id="close-about" type="button">关闭 <span aria-hidden="true">Esc</span></button>
  </main>
</body>
</html>
