name: Native desktop validation

on:
  pull_request:
    paths:
      - "tests/native*.test.mjs"
      - "tests/iconAssets.test.mjs"
      - "truedown/**"
      - "shared/**"
      - "manifest.json"
      - ".github/workflows/test-native-desktop.yml"
  push:
    branches: [main]
    paths:
      - "tests/native*.test.mjs"
      - "tests/iconAssets.test.mjs"
      - "truedown/**"
      - "shared/**"
      - "manifest.json"
      - ".github/workflows/test-native-desktop.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: truedown/desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: truedown/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Prepare Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config xvfb xauth webkit2gtk-driver
      - name: Install macOS download engine
        if: runner.os == 'macOS'
        run: brew install aria2
      - name: Install desktop build dependencies
        run: npm ci
      - name: Build native desktop and Go sidecars
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: npm run build -- --debug --no-bundle
      - name: Check Rust formatting and contracts
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          node --test ../../tests/nativeAcceptance.test.mjs ../../tests/nativeAppearance.test.mjs ../../tests/nativeFrame.test.mjs ../../tests/nativeTaskForms.test.mjs ../../tests/nativeLicenseBounds.test.mjs ../../tests/iconAssets.test.mjs
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check optimized GLib FFI regression
        if: runner.os == 'Linux'
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: cargo test --locked --release --test dependencies
      - name: Check responsive workspace and task-form usability
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          node tests/workspace-browser-smoke.mjs
          node tests/task-forms-browser-smoke.mjs
          node tests/file-groups-browser-smoke.mjs
          node tests/auxiliary-ui-browser.mjs
      - name: Check private core transport
        if: runner.os != 'Windows'
        run: |
          node ../tools/smoke-desktop.mjs target/debug/truedown-core
          node tests/task-settings-core-smoke.mjs target/debug/truedown-core
      - name: Check private core transport on Windows
        if: runner.os == 'Windows'
        run: |
          node ../tools/smoke-desktop.mjs target/debug/truedown-core.exe
          node tests/task-settings-core-smoke.mjs target/debug/truedown-core.exe
      - name: Accept hidden Windows WebView2 windows and crash recovery
        if: runner.os == 'Windows'
        run: npm run test:windows
      - name: Accept hidden Windows native bundle update and recovery
        if: runner.os == 'Windows'
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: node tests/windows-update.mjs --build
      - name: Install Linux automation driver
        if: runner.os == 'Linux'
        run: cargo +1.98.1 install tauri-driver --version 2.0.6 --locked
      - name: Accept Linux WebKitGTK windows inside Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- node tests/linux-smoke.mjs target/debug/TrueDown
