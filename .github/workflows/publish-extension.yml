name: Publish Extension

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-extension.yml"
      - "_locales/**"
      - "background/**"
      - "changelog/**"
      - "content/**"
      - "icons/**"
      - "injected/**"
      - "popup/**"
      - "shared/**"
      - "tools/build-extension.ps1"
      - "tools/read-latest-changelog.ps1"
      - "content.css"
      - "manifest.json"
      - "migrate_history_json.py"
      - "settings.css"
      - "settings.html"
      - "settings.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      ARTIFACT_NAME: KDownloader-build-${{ github.run_number }}.zip
      RELEASE_TAG: build-${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build extension
        shell: pwsh
        run: ./tools/build-extension.ps1 -OutputDirectory dist/KDownloader

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path dist/KDownloader/* -DestinationPath $env:ARTIFACT_NAME -CompressionLevel Optimal

      - name: Read latest changelog
        shell: pwsh
        run: ./tools/read-latest-changelog.ps1 -OutputFile release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDownloader-${{ env.RELEASE_TAG }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: KDownloader ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          body_path: release-notes.md
          files: ${{ env.ARTIFACT_NAME }}
