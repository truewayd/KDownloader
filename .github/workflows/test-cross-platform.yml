name: Cross-platform validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-cross-platform.yml"
      - "background/**"
      - "content/**"
      - "popup/**"
      - "shared/**"
      - "tests/**"
      - "truedown/**"
      - "manifest.json"
      - "package.json"
      - "settings.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: truedown/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install aria2 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Install aria2 on macOS
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Test extension and shared UI contracts
        run: npm test

      - name: Test TrueDown with native aria2
        working-directory: truedown
        env:
          TRUEDOWN_INTEGRATION: "1"
        run: go test ./...

      - name: Vet TrueDown
        working-directory: truedown
        run: go vet ./...

      - name: Test Unix build safety
        run: bash truedown/tools/test-unix-build-safety.sh

  package-matrix:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      PACKAGE_DIRECTORY: truedown/dist/TrueDown-${{ matrix.target.os }}-${{ matrix.target.arch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: truedown/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up native build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          npm ci --prefix truedown/desktop

      - name: Install Linux native runtime and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config xvfb xauth dbus-x11

      - name: Install aria2 on macOS
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Build package
        working-directory: truedown
        run: bash ./build-unix.sh "${{ matrix.target.os }}" "${{ matrix.target.arch }}"

      - name: Smoke test packaged Linux core
        if: runner.os == 'Linux'
        run: bash truedown/tools/smoke-linux.sh "$PACKAGE_DIRECTORY/truedown-core"

      - name: Accept packaged Linux native startup and CLI
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node truedown/desktop/tests/package-smoke.mjs "$PACKAGE_DIRECTORY/TrueDown" --virtual-display

      - name: Accept packaged macOS native startup and CLI
        if: runner.os == 'macOS'
        run: node truedown/desktop/tests/package-smoke.mjs "$PACKAGE_DIRECTORY/TrueDown.app/Contents/MacOS/TrueDown"

      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        run: |
          plutil -lint "$PACKAGE_DIRECTORY/TrueDown.app/Contents/Info.plist"
          codesign --verify --deep --strict "$PACKAGE_DIRECTORY/TrueDown.app"
