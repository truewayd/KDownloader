name: Publish TrueDown

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-truedown.yml"
      - "truedown/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-truedown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    env:
      ARTIFACT_NAME: TrueDown-build-${{ github.run_number }}.zip
      UPDATE_MANIFEST: truedown-update-${{ github.run_number }}.json
      RELEASE_TAG: truedown-build-${{ github.run_number }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: truedown/go.mod
          cache: false

      - name: Test TrueDown
        working-directory: truedown
        run: go test ./...

      - name: Build TrueDown
        run: ./truedown/build.ps1 -OutputDirectory dist/TrueDown -Version $env:RELEASE_TAG -BuildNumber ${{ github.run_number }} -Commit ${{ github.sha }}

      - name: Create release archive
        run: Compress-Archive -Path truedown/dist/TrueDown/* -DestinationPath $env:ARTIFACT_NAME -CompressionLevel Optimal

      - name: Create update manifest
        run: |
          $archive = Get-Item -LiteralPath $env:ARTIFACT_NAME
          $manifest = [ordered]@{
            schemaVersion = 1
            product = "TrueDown"
            repository = "truewayd/KDownloader"
            version = $env:RELEASE_TAG
            build = [long]${{ github.run_number }}
            asset = [ordered]@{
              name = $archive.Name
              size = $archive.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
            }
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $env:UPDATE_MANIFEST -Encoding utf8NoBOM

      - name: Select release notes
        run: ./tools/read-latest-changelog.ps1 -OutputFile release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueDown-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.UPDATE_MANIFEST }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TrueDown ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.UPDATE_MANIFEST }}
