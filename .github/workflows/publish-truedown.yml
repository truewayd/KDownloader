name: Publish TrueDown

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-truedown.yml"
      - "changelog/truedown/**"
      - "tools/read-latest-changelog.ps1"
      - "tests/releaseWorkflow.test.mjs"
      - "tests/releaseNumber.test.mjs"
      - "tests/native*.test.mjs"
      - "tests/iconAssets.test.mjs"
      - "truedown/**"
      - "shared/**"
      - "manifest.json"
      - ".gitattributes"
      - ".github/workflows/test-native-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.98.1

concurrency:
  group: publish-truedown
  cancel-in-progress: false

jobs:
  release-number:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test release numbering
        run: node --test tests/releaseNumber.test.mjs
      - name: Select next unpublished build number
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: node truedown/tools/release-number.mjs resolve

  build-windows:
    needs: [release-number]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ needs.release-number.outputs.build_number }}
      RELEASE_TAG: truedown-build-${{ needs.release-number.outputs.build_number }}
      ARTIFACT_NAME: TrueDown-build-${{ needs.release-number.outputs.build_number }}.zip
      UPDATE_MANIFEST: truedown-update-${{ needs.release-number.outputs.build_number }}.json
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release workflow safety
        run: node --test tests/releaseWorkflow.test.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up native build tools
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          npm ci --prefix truedown/desktop

      - name: Test release asset validation
        run: python -m unittest discover -s truedown/tools -p test_validate_release.py

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: truedown/go.mod
          cache: false

      - name: Test TrueDown
        working-directory: truedown
        run: go test ./...

      - name: Vet TrueDown
        working-directory: truedown
        run: go vet ./...

      - name: Accept reviewed NEXT engine
        run: ./truedown/tools/test-next-engine.ps1

      - name: Build TrueDown
        run: ./truedown/build.ps1 -OutputDirectory dist/TrueDown -Version $env:RELEASE_TAG -BuildNumber $env:BUILD_NUMBER -Commit ${{ github.sha }}

      - name: Accept packaged native startup and CLI
        env:
          TRUEDOWN_BUILD_NUMBER: ${{ needs.release-number.outputs.build_number }}
          TRUEDOWN_COMMIT: ${{ github.sha }}
        run: node truedown/desktop/tests/package-smoke.mjs truedown/dist/TrueDown/TrueDown.exe

      - name: Accept Windows installer lifecycle
        env:
          TRUEDOWN_BUILD_NUMBER: ${{ needs.release-number.outputs.build_number }}
          TRUEDOWN_COMMIT: ${{ github.sha }}
        run: ./truedown/tools/test-windows-installer.ps1 -Installer "truedown/dist/TrueDown-build-$env:BUILD_NUMBER-windows-amd64-setup.exe" -PackageDirectory truedown/dist/TrueDown

      - name: Create legacy-compatible automatic update archive
        run: |
          Copy-Item -LiteralPath "truedown/dist/TrueDown-build-$env:BUILD_NUMBER-windows-amd64-setup.exe" -Destination .
          # Shipped ZIP clients select the highest build before checking assets.
          # Every release must bridge those clients, even after a long absence.
          Compress-Archive -Path truedown/dist/TrueDown/* -DestinationPath $env:ARTIFACT_NAME -CompressionLevel Optimal

      - name: Create update manifest
        run: |
          $archive = Get-Item -LiteralPath "TrueDown-build-$env:BUILD_NUMBER-windows-amd64-setup.exe"
          $manifest = [ordered]@{
            schemaVersion = 3
            product = "TrueDown"
            repository = "truewayd/KDownloader"
            version = $env:RELEASE_TAG
            build = [long]$env:BUILD_NUMBER
            protocolVersion = 1
            platform = "windows-amd64"
            files = @("truedown-core.exe", "truedown-cli.exe", "THIRD_PARTY_NOTICES.md", "NATIVE_LICENSES.txt", "TrueDown.exe") | ForEach-Object {
              $file = Get-Item -LiteralPath (Join-Path truedown/dist/TrueDown $_)
              [ordered]@{ name = $file.Name; size = $file.Length; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant() }
            }
            asset = [ordered]@{
              name = $archive.Name
              size = $archive.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
            }
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "truedown-installer-update-$env:BUILD_NUMBER.json" -Encoding utf8NoBOM
          $archive = Get-Item -LiteralPath $env:ARTIFACT_NAME
          $manifest.schemaVersion = 2
          $manifest.asset = [ordered]@{ name = $archive.Name; size = $archive.Length; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant() }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $env:UPDATE_MANIFEST -Encoding utf8NoBOM

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrueDown-${{ env.RELEASE_TAG }}-windows-amd64
          path: |
            TrueDown-build-${{ needs.release-number.outputs.build_number }}*
            truedown-*-update-${{ needs.release-number.outputs.build_number }}.json
            truedown-update-${{ needs.release-number.outputs.build_number }}.json
          if-no-files-found: error

  build-unix:
    needs: [release-number]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, asset_os: linux, archive: tar.gz }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, asset_os: linux, archive: tar.gz }
          - { os: darwin, arch: arm64, runner: macos-15, asset_os: macos, archive: zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: truedown-build-${{ needs.release-number.outputs.build_number }}
      TRUEDOWN_VERSION: truedown-build-${{ needs.release-number.outputs.build_number }}
      TRUEDOWN_BUILD_NUMBER: ${{ needs.release-number.outputs.build_number }}
      TRUEDOWN_COMMIT: ${{ github.sha }}
      UNIX_ARTIFACT: TrueDown-build-${{ needs.release-number.outputs.build_number }}-${{ matrix.asset_os }}-${{ matrix.arch }}.${{ matrix.archive }}
      PACKAGE_DIRECTORY: truedown/dist/TrueDown-${{ matrix.os }}-${{ matrix.arch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: truedown/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up native build tools
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          npm ci --prefix truedown/desktop

      - name: Install Linux native runtime and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 libwebkit2gtk-4.1-dev build-essential libxdo-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config xvfb xauth dbus-x11

      - name: Install aria2 on macOS
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Test TrueDown with native aria2
        working-directory: truedown
        env:
          CGO_ENABLED: "0"
          TRUEDOWN_INTEGRATION: "1"
        run: go test ./...

      - name: Vet TrueDown
        working-directory: truedown
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test Unix build safety
        run: bash truedown/tools/test-unix-build-safety.sh

      - name: Build Unix package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash truedown/build-unix.sh "${{ matrix.os }}" "${{ matrix.arch }}"

      - name: Smoke test packaged Linux core
        if: runner.os == 'Linux'
        run: bash truedown/tools/smoke-linux.sh "$PACKAGE_DIRECTORY/truedown-core"

      - name: Accept packaged Linux native startup and CLI
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node truedown/desktop/tests/package-smoke.mjs "$PACKAGE_DIRECTORY/TrueDown" --virtual-display

      - name: Accept packaged macOS native startup and CLI
        if: runner.os == 'macOS'
        run: node truedown/desktop/tests/package-smoke.mjs "$PACKAGE_DIRECTORY/TrueDown.app/Contents/MacOS/TrueDown"

      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        run: |
          plutil -lint "$PACKAGE_DIRECTORY/TrueDown.app/Contents/Info.plist"
          codesign --verify --deep --strict "$PACKAGE_DIRECTORY/TrueDown.app"

      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -czf "$UNIX_ARTIFACT" -C truedown/dist "TrueDown-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: zip -r "$GITHUB_WORKSPACE/$UNIX_ARTIFACT" TrueDown.app README.md THIRD_PARTY_NOTICES.md NATIVE_LICENSES.txt

      - name: Upload Unix build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TrueDown-${{ env.RELEASE_TAG }}-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: ${{ env.UNIX_ARTIFACT }}
          if-no-files-found: error

  native-acceptance:
    uses: ./.github/workflows/test-native-desktop.yml

  publish-release:
    needs: [release-number, build-windows, build-unix, native-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ needs.release-number.outputs.build_number }}
      RELEASE_TAG: truedown-build-${{ needs.release-number.outputs.build_number }}
      ARTIFACT_NAME: TrueDown-build-${{ needs.release-number.outputs.build_number }}.zip
      UPDATE_MANIFEST: truedown-update-${{ needs.release-number.outputs.build_number }}.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: TrueDown-${{ env.RELEASE_TAG }}-*
          path: release-assets
          merge-multiple: true

      - name: Validate complete release asset set
        run: python3 truedown/tools/validate_release.py release-assets --build "$BUILD_NUMBER"

      - name: Select release notes
        shell: pwsh
        run: |
          ./tools/read-latest-changelog.ps1 -Product TrueDown -OutputFile release-notes.md
          $installer = "TrueDown-build-$env:BUILD_NUMBER-windows-amd64-setup.exe"
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$installer"
          $notes = [System.IO.File]::ReadAllText("release-notes.md")
          [System.IO.File]::WriteAllText("release-notes.md", "[Windows installer ($installer)]($download)`n`nWindows updates use the installer. The compatibility ZIP and schema-2 manifest let older clients migrate automatically; after migration, all updates use the installer.`n`n$notes")

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Guard release identity and discard incomplete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node truedown/tools/release-number.mjs prepare "$BUILD_NUMBER" "$GITHUB_SHA"

      - name: Upload draft GitHub Release
        id: draft-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TrueDown ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: true
          files: |
            release-assets/*

      - name: Publish only after uploaded assets are complete
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        run: |
          python3 -m unittest discover -s truedown/tools -p test_validate_release_assets.py
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            | python3 truedown/tools/validate_release_assets.py release-assets
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify updater-visible release metadata
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 \
              --max-filesize 4194304 -o public-releases.json \
              -H 'Accept: application/vnd.github+json, application/octet-stream;q=0.9' \
              -H 'User-Agent: TrueDown/release-validation' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=50" \
              && curl --fail --silent --show-error --max-time 30 \
              --max-filesize 4194304 -o public-assets.json \
              -H 'Accept: application/vnd.github+json, application/octet-stream;q=0.9' \
              -H 'User-Agent: TrueDown/release-validation' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              && python3 truedown/tools/validate_release_assets.py release-assets \
              --release-tag "$RELEASE_TAG" --release-id "$RELEASE_ID" \
              --asset-metadata public-assets.json < public-releases.json; then
              exit 0
            fi
            sleep 10
          done
          echo "Published release is not yet visible with complete assets to the updater" >&2
          exit 1
