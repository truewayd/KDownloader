<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDownloader Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="2"></rect>
      <rect x="3" y="14" width="18" height="6" rx="2"></rect>
      <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24">
      <path d="M17.5 19H8a5 5 0 1 1 1.1-9.88A6 6 0 0 1 20 12.5 3.5 3.5 0 0 1 17.5 19Z"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3 2"></path>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
      <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path>
      <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M5 3h12l2 2v16H5Z"></path>
      <path d="M8 3v6h8V3M8 21v-7h8v7"></path>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 0 0-14.9-4M4 5v6h6"></path>
      <path d="M4 13a8 8 0 0 0 14.9 4M20 19v-6h-6"></path>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 16V4"></path>
      <path d="m7 9 5-5 5 5"></path>
      <path d="M5 20h14"></path>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 4v12"></path>
      <path d="m7 11 5 5 5-5"></path>
      <path d="M5 20h14"></path>
    </symbol>
  </svg>

  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">KDownloader</div>
        <h1>Advanced Settings</h1>
      </div>
      <div class="status-chip" id="save-status">Idle</div>
    </header>

    <section class="settings-grid">
      <article class="panel panel-wide">
        <div class="panel-heading">
          <svg class="icon"><use href="#icon-server"></use></svg>
          <h2>Backend</h2>
        </div>
        <div class="form-grid two">
          <label class="field field-inline">
            <input type="checkbox" id="backend-enabled" class="toggle">
            <span>Enable backend dispatch</span>
          </label>
          <label class="field">
            <span>Backend type</span>
            <div class="segmented" role="group" aria-label="Backend type">
              <button type="button" class="segment active" id="backend-type-abdm" data-type="abdm">ABDM</button>
              <button type="button" class="segment" id="backend-type-gopeed" data-type="gopeed">Gopeed</button>
            </div>
          </label>
        </div>
        <div class="backend-details hidden" id="backend-details">
          <div class="backend-config" id="abdm-fields">
            <label class="field">
              <span>ABDM protocol</span>
              <select id="backend-protocol">
                <option value="http">http</option>
                <option value="https">https</option>
              </select>
            </label>
            <label class="field">
              <span>ABDM host</span>
              <input id="backend-host" type="text" placeholder="127.0.0.1">
            </label>
            <label class="field">
              <span>ABDM port</span>
              <input id="backend-port" type="number" min="1" max="65535" step="1" placeholder="15151">
            </label>
          </div>
          <div class="backend-config hidden" id="gopeed-fields">
            <label class="field">
              <span>Gopeed protocol</span>
              <select id="gopeed-protocol">
                <option value="http">http</option>
                <option value="https">https</option>
              </select>
            </label>
            <label class="field">
              <span>Gopeed host</span>
              <input id="gopeed-host" type="text" placeholder="127.0.0.1">
            </label>
            <label class="field">
              <span>Gopeed port</span>
              <input id="gopeed-port" type="number" min="1" max="65535" step="1" placeholder="9999">
            </label>
            <label class="field">
              <span>API token</span>
              <input id="gopeed-token" type="password" autocomplete="off">
            </label>
          </div>
          <div class="backend-config backend-batching">
            <label class="field">
              <span>Concurrency</span>
              <input id="backend-concurrency" type="number" min="1" max="6" step="1">
            </label>
            <label class="field">
              <span>Retry count</span>
              <input id="backend-retry-count" type="number" min="0" max="10" step="1">
            </label>
            <label class="field">
              <span>Per-post file limit</span>
              <input id="backend-file-limit" type="number" min="1" max="1000" step="1">
            </label>
          </div>
        </div>
      </article>

      <article class="panel">
        <div class="panel-heading">
          <svg class="icon"><use href="#icon-clock"></use></svg>
          <h2>Favorites</h2>
        </div>
        <div class="form-grid">
          <label class="field field-inline">
            <input type="checkbox" id="favorites-enabled" class="toggle">
            <span>Enable watcher</span>
          </label>
          <label class="field">
            <span>Interval minutes</span>
            <input id="favorites-interval" type="number" min="1" step="1">
          </label>
          <button type="button" class="button secondary" id="favorites-check">
            <svg class="button-icon"><use href="#icon-refresh"></use></svg>
            Check now
          </button>
        </div>
      </article>

      <article class="panel">
        <div class="panel-heading">
          <svg class="icon"><use href="#icon-database"></use></svg>
          <h2>Search Cache</h2>
        </div>
        <div class="form-grid">
          <label class="field field-inline">
            <input type="checkbox" id="creators-enabled" class="toggle">
            <span>Enable Search Page Fetch</span>
          </label>
          <div class="cache-list">
            <div>
              <strong>Coomer</strong>
              <span id="creators-coomer-meta">Never</span>
            </div>
            <button type="button" class="icon-button" id="creators-update-coomer" title="Refresh Coomer cache">
              <svg class="button-icon"><use href="#icon-refresh"></use></svg>
            </button>
          </div>
          <div class="cache-list">
            <div>
              <strong>Kemono</strong>
              <span id="creators-kemono-meta">Never</span>
            </div>
            <button type="button" class="icon-button" id="creators-update-kemono" title="Refresh Kemono cache">
              <svg class="button-icon"><use href="#icon-refresh"></use></svg>
            </button>
          </div>
        </div>
      </article>

      <article class="panel panel-wide">
        <div class="panel-heading">
          <svg class="icon"><use href="#icon-cloud"></use></svg>
          <h2>GitHub Gist Sync</h2>
        </div>
        <div class="form-grid two">
          <label class="field field-inline">
            <input type="checkbox" id="gist-enabled" class="toggle">
            <span>Enable GitHub Gist Sync</span>
          </label>
          <div></div>
          <label class="field">
            <span>Token</span>
            <input id="gist-token" type="password" autocomplete="off">
          </label>
          <label class="field">
            <span>Gist ID</span>
            <input id="gist-id" type="text">
          </label>
          <div class="button-row">
            <button type="button" class="button secondary" id="gist-save">
              <svg class="button-icon"><use href="#icon-save"></use></svg>
              Save Gist config
            </button>
            <button type="button" class="button secondary" id="gist-download">
              <svg class="button-icon"><use href="#icon-download"></use></svg>
              Download
            </button>
            <button type="button" class="button secondary" id="gist-upload">
              <svg class="button-icon"><use href="#icon-upload"></use></svg>
              Upload
            </button>
          </div>
        </div>
      </article>

      <article class="panel panel-wide danger-panel">
        <div class="panel-heading">
          <svg class="icon"><use href="#icon-database"></use></svg>
          <h2>History Maintenance</h2>
        </div>
        <div class="danger-row">
          <div>
            <strong>Clear local download history</strong>
            <span>This permanently removes downloaded markers from extension storage.</span>
          </div>
          <button type="button" class="button danger" id="clear-history">Clear history</button>
        </div>
      </article>
    </section>

    <footer class="action-bar">
      <button type="button" class="button secondary" id="restore-defaults">
        <svg class="button-icon"><use href="#icon-refresh"></use></svg>
        Restore defaults
      </button>
      <button type="button" class="button secondary" id="reload-settings">
        <svg class="button-icon"><use href="#icon-refresh"></use></svg>
        Reload
      </button>
      <button type="button" class="button primary" id="save-settings">
        <svg class="button-icon"><use href="#icon-save"></use></svg>
        Save settings
      </button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="settings.js"></script>
</body>
</html>
