<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDownloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-topbar">
    <div>
      <div class="eyebrow">KDownloader</div>
      <h1>Kemono Toolkit</h1>
    </div>
    <div class="topbar-status">
      <span id="storage-used">Calculating...</span>
      <span id="popup-version">v?</span>
    </div>
  </header>

  <div id="global-progress" class="global-progress hidden">
    <div class="global-progress-inner">
      <div class="global-progress-label" id="global-progress-label">Sending...</div>
      <div class="global-progress-track"><div class="global-progress-fill" id="global-progress-fill"></div></div>
    </div>
  </div>

  <main class="container">
    <section class="stats creator-fetch-panel">
      <h2>Creator Fetch</h2>
      <div class="column mt-8">
        <input id="creator-url" type="text" placeholder="Configure and enable backend first" class="input-flex" />
        <div class="row mt-8 align-right">
          <button class="btn" id="creator-fetch-btn">Settings</button>
        </div>
      </div>
    </section>

    <section class="stats hidden" id="search-cache-panel">
      <h2>Search Page Fetch</h2>
      <div class="row mt-8 align-right">
        <button class="btn secondary" id="creators-update-coomer">Cache Coomer</button>
        <button class="btn secondary" id="creators-update-kemono">Cache Kemono</button>
      </div>
    </section>

    <section class="stats hidden" id="gist-panel">
      <h2>GitHub Gist Sync</h2>
      <div class="row mt-8 align-right">
        <button class="btn secondary" id="gist-download-btn">Download</button>
        <button class="btn" id="gist-upload-btn">Upload</button>
      </div>
    </section>

    <section class="stats">
      <h2>History</h2>
      <div class="row mt-8 align-right">
        <button class="btn secondary" id="import-btn">Import</button>
        <button class="btn" id="export-btn">Export</button>
      </div>
    </section>

    <input type="file" id="file-input" class="file-input" accept="application/json">
  </main>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Processing...</div>
  </div>
  <div class="success-message" id="success-message"></div>
  <div class="error-message" id="error-message"></div>

  <script src="popup.js"></script>
</body>
</html>
