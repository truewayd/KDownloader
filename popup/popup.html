<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="appName">KDownloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="2"></rect>
      <rect x="3" y="14" width="18" height="6" rx="2"></rect>
      <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
    </symbol>
    <symbol id="icon-cloud" viewBox="0 0 24 24">
      <path d="M17.5 19H8a5 5 0 1 1 1.1-9.88A6 6 0 0 1 20 12.5 3.5 3.5 0 0 1 17.5 19Z"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3 2"></path>
    </symbol>
    <symbol id="icon-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
      <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path>
      <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
    </symbol>
    <symbol id="icon-save" viewBox="0 0 24 24">
      <path d="M5 3h12l2 2v16H5Z"></path>
      <path d="M8 3v6h8V3M8 21v-7h8v7"></path>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 0 0-14.9-4M4 5v6h6"></path>
      <path d="M4 13a8 8 0 0 0 14.9 4M20 19v-6h-6"></path>
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 16V4"></path>
      <path d="m7 9 5-5 5 5"></path>
      <path d="M5 20h14"></path>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 4v12"></path>
      <path d="m7 11 5 5 5-5"></path>
      <path d="M5 20h14"></path>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </symbol>
  </svg>

  <header class="popup-topbar">
    <div>
      <div class="eyebrow" data-i18n="appName">KDownloader</div>
      <h1 data-i18n="popupTitle">Kemono Toolkit</h1>
    </div>
    <div class="topbar-status">
      <span id="storage-used" data-i18n="storageCalculating">Calculating...</span>
      <span id="popup-version">v?</span>
    </div>
  </header>

  <div id="global-progress" class="global-progress hidden">
    <div class="global-progress-inner">
      <div class="global-progress-label" id="global-progress-label" data-i18n="statusSending">Sending...</div>
      <div class="global-progress-track"><div class="global-progress-fill" id="global-progress-fill"></div></div>
    </div>
  </div>

  <main class="container">
    <section class="stats search-panel">
      <div class="panel-heading">
        <svg class="icon"><use href="#icon-search"></use></svg>
        <h2 data-i18n="siteSearchTitle">Site Search</h2>
      </div>
      <form class="search-form mt-8" id="site-search-form">
        <select id="site-search-site" data-i18n-aria-label="searchSiteLabel" aria-label="Site">
          <option value="pawchive">Pawchive</option>
          <option value="kemono">Kemono</option>
          <option value="coomer">Coomer</option>
          <option value="coomerfans">CoomerFans</option>
        </select>
        <input id="site-search-query" type="text" placeholder="Search creators" data-i18n-placeholder="siteSearchPlaceholder" data-i18n-aria-label="siteSearchPlaceholder" aria-label="Search creators" class="input-flex" autocomplete="off" />
        <button class="btn icon-button" id="site-search-btn" type="submit" title="Search" data-i18n-title="searchAction" data-i18n-aria-label="searchAction" aria-label="Search">
          <svg class="button-icon"><use href="#icon-search"></use></svg>
        </button>
      </form>
    </section>

    <section class="stats creator-fetch-panel">
      <div class="panel-heading">
        <svg class="icon"><use href="#icon-server"></use></svg>
        <h2 data-i18n="creatorFetchTitle">Creator Fetch</h2>
      </div>
      <div class="column mt-8">
        <input id="creator-url" type="text" placeholder="Configure and enable backend first" data-i18n-placeholder="creatorFetchBackendRequiredPlaceholder" class="input-flex" />
        <label class="creator-fetch-mode" for="creator-fetch-mode" data-i18n-title="creatorFetchModeTooltip" title="Choose normal, full, or links-only creator fetching">
          <span data-i18n="creatorFetchModeLabel">Mode</span>
          <select id="creator-fetch-mode">
            <option value="default" data-i18n="creatorFetchModeDefault">Default</option>
            <option value="full" data-i18n="creatorFetchModeFull">Full</option>
            <option value="links" data-i18n="creatorFetchModeLinksOnly">Links only</option>
          </select>
        </label>
        <div class="row mt-8 align-right">
          <button class="btn" id="creator-fetch-btn">
            <svg class="button-icon"><use href="#icon-server"></use></svg>
            <span data-i18n="settingsAction">Settings</span>
          </button>
        </div>
      </div>
    </section>

    <section class="stats hidden" id="search-cache-panel">
      <div class="panel-heading">
        <svg class="icon"><use href="#icon-database"></use></svg>
        <h2 data-i18n="searchPageFetchTitle">Search Page Fetch</h2>
      </div>
      <div class="row mt-8 align-right">
        <button class="btn secondary" id="creators-update-coomer">
          <svg class="button-icon"><use href="#icon-refresh"></use></svg>
          <span data-i18n="cacheCoomerAction">Cache Coomer</span>
        </button>
        <button class="btn secondary" id="creators-update-kemono">
          <svg class="button-icon"><use href="#icon-refresh"></use></svg>
          <span data-i18n="cacheKemonoAction">Cache Kemono</span>
        </button>
      </div>
    </section>

    <section class="stats hidden" id="gist-panel">
      <div class="panel-heading">
        <svg class="icon"><use href="#icon-cloud"></use></svg>
        <h2 data-i18n="gistSyncTitle">GitHub Gist Sync</h2>
      </div>
      <div class="row mt-8 align-right">
        <button class="btn secondary" id="gist-download-btn">
          <svg class="button-icon"><use href="#icon-download"></use></svg>
          <span data-i18n="downloadAction">Download</span>
        </button>
        <button class="btn" id="gist-upload-btn">
          <svg class="button-icon"><use href="#icon-upload"></use></svg>
          <span data-i18n="uploadAction">Upload</span>
        </button>
      </div>
    </section>

    <section class="stats">
      <div class="panel-heading">
        <svg class="icon"><use href="#icon-database"></use></svg>
        <h2 data-i18n="historyTitle">History</h2>
      </div>
      <div class="row mt-8 align-right">
        <button class="btn secondary" id="import-btn">
          <svg class="button-icon"><use href="#icon-upload"></use></svg>
          <span data-i18n="importAction">Import</span>
        </button>
        <button class="btn" id="export-btn">
          <svg class="button-icon"><use href="#icon-download"></use></svg>
          <span data-i18n="exportAction">Export</span>
        </button>
      </div>
    </section>

    <input type="file" id="file-input" class="file-input" accept="application/json">
  </main>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div data-i18n="statusProcessing">Processing...</div>
  </div>
  <div class="success-message" id="success-message"></div>
  <div class="error-message" id="error-message"></div>

  <script src="../shared/i18n.js"></script>
  <script src="search.js"></script>
  <script src="popup.js"></script>
</body>
</html>
