<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="appName">KDownloader</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-topbar">
    <div>
      <div class="kd-eyebrow" data-i18n="appName">KDownloader</div>
      <h1 data-i18n="popupTitle">Kemono Toolkit</h1>
    </div>
    <div class="topbar-status">
      <span id="storage-used" data-i18n="storageCalculating">Calculating...</span>
      <span id="popup-version">v?</span>
    </div>
  </header>

  <div id="global-progress" class="kd-progress kd-hidden" aria-hidden="true">
    <div class="kd-progress-inner">
      <div class="kd-progress-label" id="global-progress-label" data-i18n="statusSending">Sending...</div>
      <div class="kd-progress-track" id="global-progress-track" role="progressbar" aria-labelledby="global-progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="kd-progress-fill" id="global-progress-fill"></div>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="kd-panel search-panel">
      <div class="kd-panel-heading">
        <svg class="kd-icon"><use href="../shared/icons.svg#icon-search"></use></svg>
        <h2 data-i18n="siteSearchTitle">Site Search</h2>
      </div>
      <form class="search-form mt-8" id="site-search-form">
        <select class="kd-select" id="site-search-site" data-i18n-aria-label="searchSiteLabel" aria-label="Site">
          <option value="pawchive">Pawchive</option>
          <option value="kemono">Kemono</option>
          <option value="coomer">Coomer</option>
          <option value="coomerfans">CoomerFans</option>
        </select>
        <input id="site-search-query" type="text" maxlength="512" placeholder="Search creators" data-i18n-placeholder="siteSearchPlaceholder" data-i18n-aria-label="siteSearchPlaceholder" aria-label="Search creators" class="kd-input input-flex" autocomplete="off" />
        <button class="kd-button kd-icon-button" id="site-search-btn" type="submit" title="Search" data-i18n-title="searchAction" data-i18n-aria-label="searchAction" aria-label="Search">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-search"></use></svg>
        </button>
      </form>
    </section>

    <section class="kd-panel creator-fetch-panel">
      <div class="kd-panel-heading">
        <svg class="kd-icon"><use href="../shared/icons.svg#icon-server"></use></svg>
        <h2 data-i18n="creatorFetchTitle">Creator Fetch</h2>
      </div>
      <div class="column mt-8">
        <input id="creator-url" type="url" maxlength="8192" placeholder="Configure and enable backend first" data-i18n-placeholder="creatorFetchBackendRequiredPlaceholder" data-i18n-aria-label="creatorFetchTitle" aria-label="Creator Fetch" class="kd-input input-flex" autocomplete="off" spellcheck="false" />
        <label class="creator-fetch-mode" for="creator-fetch-mode" data-i18n-title="creatorFetchModeTooltip" title="Choose normal, full, or links-only creator fetching">
          <span data-i18n="creatorFetchModeLabel">Mode</span>
          <select class="kd-select" id="creator-fetch-mode">
            <option value="default" data-i18n="creatorFetchModeDefault">Default</option>
            <option value="full" data-i18n="creatorFetchModeFull">Full</option>
            <option value="links" data-i18n="creatorFetchModeLinksOnly">Links only</option>
            <option value="dms" data-i18n="creatorFetchModeDms">Pawchive DMs</option>
          </select>
        </label>
        <div class="row mt-8 align-right">
          <button type="button" class="kd-button" id="creator-fetch-btn">
            <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-server"></use></svg>
            <span data-i18n="settingsAction">Settings</span>
          </button>
        </div>
      </div>
    </section>

    <section class="kd-panel kd-hidden" id="search-cache-panel">
      <div class="kd-panel-heading">
        <svg class="kd-icon"><use href="../shared/icons.svg#icon-database"></use></svg>
        <h2 data-i18n="searchPageFetchTitle">Search Page Fetch</h2>
      </div>
      <div class="row mt-8 align-right">
        <button type="button" class="kd-button secondary" id="creators-update-coomer">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-refresh"></use></svg>
          <span data-i18n="cacheCoomerAction">Cache Coomer</span>
        </button>
        <button type="button" class="kd-button secondary" id="creators-update-kemono">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-refresh"></use></svg>
          <span data-i18n="cacheKemonoAction">Cache Kemono</span>
        </button>
      </div>
    </section>

    <section class="kd-panel kd-hidden" id="gist-panel">
      <div class="kd-panel-heading">
        <svg class="kd-icon"><use href="../shared/icons.svg#icon-cloud"></use></svg>
        <h2 data-i18n="gistSyncTitle">GitHub Gist Sync</h2>
      </div>
      <div class="row mt-8 align-right">
        <button type="button" class="kd-button secondary" id="gist-download-btn">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-download"></use></svg>
          <span data-i18n="downloadAction">Download</span>
        </button>
        <button type="button" class="kd-button primary" id="gist-upload-btn">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-upload"></use></svg>
          <span data-i18n="uploadAction">Upload</span>
        </button>
      </div>
    </section>

    <section class="kd-panel">
      <div class="kd-panel-heading">
        <svg class="kd-icon"><use href="../shared/icons.svg#icon-database"></use></svg>
        <h2 data-i18n="historyTitle">History</h2>
      </div>
      <div class="row mt-8 align-right">
        <button type="button" class="kd-button secondary" id="import-btn">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-upload"></use></svg>
          <span data-i18n="importAction">Import</span>
        </button>
        <button type="button" class="kd-button primary" id="export-btn">
          <svg class="kd-button-icon"><use href="../shared/icons.svg#icon-download"></use></svg>
          <span data-i18n="exportAction">Export</span>
        </button>
      </div>
    </section>

    <input type="file" id="file-input" class="file-input" accept="application/json,.json" tabindex="-1" aria-hidden="true">
  </main>

  <div class="kd-loading" id="loading" role="status" aria-live="polite" aria-hidden="true">
    <div class="kd-spinner"></div>
    <div data-i18n="statusProcessing">Processing...</div>
  </div>
  <div class="kd-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/components.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="search.js"></script>
  <script src="popup.js"></script>
</body>
</html>
